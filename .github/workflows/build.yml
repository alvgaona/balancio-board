name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # The full image ships KiCad's 3D models, which the GLB export needs. Keep it on the KiCad the design is saved with.
    container:
      image: kicad/kicad:10.0.8-full
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # package.py names the commit with git describe, which needs the tags
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: scripts/build.sh
      # The board package holds every export; the reports explain a failed ERC or DRC
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: board-package
          path: |
            build/*-rev*.zip
            build/*.rpt
          if-no-files-found: ignore
