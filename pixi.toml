[workspace]
authors = ["Alvaro Gaona <alvgaona@gmail.com>"]
channels = ['conda-forge']
description = "Controller board for the Balancio self-balancing robot: ESP32 DevKit, DRV8833 motor driver, MPU-6050 IMU and 2S battery protection"
name = "balancio-board"
platforms = ['osx-arm64', 'linux-64']
version = "1.1.0"

[tasks]
build = "scripts/build.sh"
changelog = "git-cliff -o CHANGELOG.md"
hooks = "lefthook install"

[dependencies]
git-cliff = ">=2.14.2,<3"
lefthook = ">=2.2.2,<3"
commitlint = ">=21.2.4,<22"
