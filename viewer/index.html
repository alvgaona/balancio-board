<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board 3D</title>
<style>
  /* One light backdrop in both themes: a black board on a dark page loses its edges. */
  :root { --backdrop: #dfdfe2; --text: #3b3d42; color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--backdrop); }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #status { position: fixed; left: 16px; bottom: 14px; font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--text); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<!-- 3D view of a KiCad board, from the GLB that build.sh exports (kicad-cli pcb export glb). Serve the repository
     root and open /viewer/: python3 -m http.server 8000, then http://localhost:8000/viewer/
     Everything board-specific is in board.json (or ?board=other.json): the model, the pad finish, which part
     colours are metal, and the parts keys 4 and up look at. Drag rotates, scroll zooms, right-drag pans.
     Keys: space starts/stops the spin, 1 angled view, 2 top, 3 bottom (?view=<key> opens on one). -->
<canvas id="view" aria-label="Interactive 3D model of the board"></canvas>
<div id="status" role="status">Loading…</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const status = document.getElementById("status");
try {
  const cfgUrl = new URL(new URLSearchParams(location.search).get("board") || "board.json", location.href);
  const cfg = await (await fetch(cfgUrl)).json();
  document.title = `${cfg.title} 3D`;
  document.getElementById("view").setAttribute("aria-label", `Interactive 3D model of the ${cfg.title}`);
  const res = await fetch(new URL(cfg.model, cfgUrl));
  if (!res.ok) throw new Error(`${cfg.model}: HTTP ${res.status} (run scripts/build.sh first)`);
  const gltf = await new GLTFLoader().parseAsync(await res.arrayBuffer(), "");

  const canvas = document.getElementById("view");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  // The look of the JLCPCB black board (as in ~/git/board-challenge):
  //  - the mask is a neutral black, 88 % opaque, so copper shows through as a slightly lighter black;
  //  - copper is recoloured light grey first: orange copper under black mask reads brown;
  //  - the board core is dark, so only copper reads through the mask;
  //  - the surroundings light the scene dimly (a glossy black lit by a bright backdrop turns grey),
  //    while the backdrop the camera sees stays light.
  const LOOK = { mask: [0.012, 0.012, 0.014], maskOpacity: 0.88, maskRoughness: 0.35, core: [0.05, 0.045, 0.035],
                 copper: [0.6, 0.56, 0.5], copperRoughness: 0.3, silk: "#f5f5f0", surroundings: 0.25 };
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor(getComputedStyle(document.documentElement).getPropertyValue("--backdrop").trim(), 1);

  const scene = new THREE.Scene();
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.03).texture;
  for (const [x, y, z, power] of [[0.4, 1.0, 0.5, 3.0], [-0.3, -1.0, -0.4, 2.0]]) {  // key light and one from below
    const sun = new THREE.DirectionalLight(0xffffff, power);
    sun.position.set(x, y, z);
    scene.add(sun);
  }

  // KiCad exports every face as its own mesh (tens of thousands): merge them by material, in mm, for speed.
  // Board layers are KiCad's own meshes, named <board>_<layer>; parts keep their models' colours.
  const json = gltf.parser.json, assoc = gltf.parser.associations;
  const toMm = new THREE.Matrix4().makeScale(1000, 1000, 1000);
  gltf.scene.updateMatrixWorld(true);
  const groups = new Map();
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const name = json.meshes[assoc.get(o)?.meshes]?.name || "";
    const layer = /_(soldermask|PCB|copper|via|pad|silkscreen)$/.exec(name)?.[1] || "part";
    const key = `${layer} ${o.material.uuid}`;
    if (!groups.has(key)) groups.set(key, { layer, material: o.material, geos: [] });
    const g = new THREE.BufferGeometry();  // positions only: shading is flat, the mask gets computed normals
    g.setAttribute("position", o.geometry.getAttribute("position").clone());
    const idx = o.geometry.getIndex();
    g.setIndex(idx ? idx.clone() : [...Array(g.getAttribute("position").count).keys()]);
    groups.get(key).geos.push(g.applyMatrix4(toMm.clone().multiply(o.matrixWorld)));
  });

  const near = (hex, list) => Object.keys(list).find((h) => {
    const a = new THREE.Color(hex), b = new THREE.Color(h);  // compared in sRGB, as board.json lists them
    const [x, y] = [a.getRGB({}, THREE.SRGBColorSpace), b.getRGB({}, THREE.SRGBColorSpace)];
    return Math.abs(x.r - y.r) < 0.01 && Math.abs(x.g - y.g) < 0.01 && Math.abs(x.b - y.b) < 0.01;
  });
  const board = new THREE.Group();
  for (const { layer, material: src, geos } of groups.values()) {
    const geo = mergeGeometries(geos);
    const mat = new THREE.MeshStandardMaterial({ color: src.color.clone(), roughness: 0.8, metalness: 0, flatShading: true,
                                                 side: THREE.DoubleSide, envMapIntensity: LOOK.surroundings });
    const mesh = new THREE.Mesh(geo, mat);
    if (layer === "soldermask") {
      Object.assign(mat, { color: new THREE.Color(...LOOK.mask), transparent: true, opacity: LOOK.maskOpacity,
                           roughness: LOOK.maskRoughness, depthWrite: false, flatShading: false });
      geo.computeVertexNormals();
      mesh.renderOrder = 1;
    } else if (layer === "PCB") mat.color.setRGB(...LOOK.core);
    else if (layer === "copper" || layer === "via") Object.assign(mat, { color: new THREE.Color(...LOOK.copper), roughness: LOOK.copperRoughness, metalness: 1 });
    else if (layer === "pad") Object.assign(mat, { color: new THREE.Color(cfg.pads), metalness: 1, roughness: 0.3, envMapIntensity: 1 });
    else if (layer === "silkscreen") mat.color.set(LOOK.silk);
    else {
      // KiCad's part models leave metallicFactor out, which glTF reads as fully metal: plastic unless board.json
      // lists the colour as metal, then shiny, as the pads
      const hex = "#" + src.color.getHexString();
      if (near(hex, cfg.metal || {})) Object.assign(mat, { metalness: 1, roughness: 0.3, envMapIntensity: 1 });
      const to = near(hex, cfg.recolor || {});
      if (to) mat.color.set(cfg.recolor[to]);
    }
    board.add(mesh);
  }
  const box = new THREE.Box3().setFromObject(board);
  const centre = box.getCenter(new THREE.Vector3());
  board.position.sub(centre);
  scene.add(board);

  // Parts to look at, by reference: the centre of that footprint's 3D models
  const focus = {};
  for (const [key, ref] of Object.entries(cfg.focus || {})) {
    const node = gltf.scene.getObjectByName(ref);
    if (!node) { console.warn(`board.json focus: ${ref} is not in the model`); continue; }
    focus[key] = new THREE.Box3().setFromObject(node).getCenter(new THREE.Vector3()).multiplyScalar(1000).sub(centre);
  }

  // board-challenge's views are set for its 40 mm board: scale them to this one
  const s = Math.max(box.max.x - box.min.x, box.max.z - box.min.z) / 40;
  const camera = new THREE.PerspectiveCamera(32, 1, 2, 600 * s);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.minDistance = 12;  // close enough for a single part
  controls.maxDistance = 260 * s;
  controls.autoRotate = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  controls.autoRotateSpeed = 1.2;

  const views = { 1: [-40 * s, 48 * s, 52 * s], 2: [0, 86 * s, 0.01], 3: [0, -86 * s, 0.01] };
  const setView = (key) => {
    const target = focus[key] || new THREE.Vector3();
    camera.position.copy(focus[key] ? new THREE.Vector3(-1, 0.75, 0.6).setLength(30).add(target) : new THREE.Vector3(...views[key]));
    controls.target.copy(target);
    if (focus[key]) controls.autoRotate = false;
    controls.update();
  };
  canvas.addEventListener("pointerdown", () => { controls.autoRotate = false; });
  window.addEventListener("keydown", (e) => {
    if (e.key === " ") { controls.autoRotate = !controls.autoRotate; e.preventDefault(); }
    if (views[e.key] || focus[e.key]) setView(e.key);
  });
  setView(new URLSearchParams(location.search).get("view") || "1");  // ?view=4 opens on that key's view

  const resize = () => {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  };
  renderer.setAnimationLoop(() => { resize(); controls.update(); renderer.render(scene, camera); });
  status.remove();
} catch (err) {
  status.textContent = "Could not show the 3D view: " + err.message;
  console.error(err);
}
</script>
</body>
</html>
